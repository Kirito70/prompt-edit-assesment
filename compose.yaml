name: prompt-edit

x-app: &app
  build:
    context: .
    args:
      VITE_APP_NAME: ${APP_NAME:-Laravel}
      VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY:?set PUSHER_APP_KEY in .env}
      VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:?set PUSHER_APP_CLUSTER in .env}
  image: prompt-edit:${APP_VERSION:-latest}
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  init: true
  read_only: true
  tmpfs:
    - /tmp:uid=1000,gid=1000,mode=0700,size=64m
    - /app/storage:uid=1000,gid=1000,mode=0700,size=64m
    - /app/bootstrap/cache:uid=1000,gid=1000,mode=0700,size=16m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-laravel}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    logging: *logging

  web:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    mem_limit: 512m
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--max-jobs=500", "--memory=256"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    mem_limit: 384m
    stop_grace_period: 60s
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    mem_limit: 256m
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
